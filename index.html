<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClientFy Dashboard</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:var(--tg-theme-bg-color);color:var(--tg-theme-text-color);padding:16px}
.card{background:var(--tg-theme-secondary-bg-color);border-radius:12px;padding:16px;margin-bottom:12px}
h1{font-size:20px;margin:0 0 12px}
.stat{display:flex;justify-content:space-between;margin:8px 0;font-size:14px}
.label{color:var(--tg-theme-hint-color)}
.value{font-weight:700}
</style>
</head>
<body>
<h1>📊 Дашборд ClientFy</h1>
<div class="card">
  <div class="stat"><span class="label">Пользователей</span><span class="value" id="users">—</span></div>
  <div class="stat"><span class="label">Активных сегодня</span><span class="value" id="active">—</span></div>
  <div class="stat"><span class="label">Всего поисков</span><span class="value" id="searches">—</span></div>
  <div class="stat"><span class="label">Каналов найдено</span><span class="value" id="channels">—</span></div>
</div>
<p style="color:var(--tg-theme-hint-color);font-size:13px">Данные обновляются при открытии.</p>
<script>
const TW = window.TelegramWidget;
// Mini App init
if(window.Telegram && window.Telegram.WebApp){
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
</script>
</body>
</html>
